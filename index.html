<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LifeOS Capture">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http: https:; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'">
  <meta name="theme-color" content="#f4f6f1">
  <meta name="description" content="私密、离线优先的 LifeOS 移动记录工具">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./sync.css">
  <title>LifeOS 随手记</title>
</head>
<body>
  <div class="app-shell shell">
    <header class="app-header">
      <div><div class="brand">LifeOS</div><h1 id="page-title"></h1><p id="today-date" class="header-date date-line"></p></div>
      <button id="header-status" class="status-pill header-status" type="button" data-go="pending"></button>
    </header>
    <main id="main-content">
      <section id="view-today" class="app-view active" data-view-panel="today"></section>
      <section id="view-capture" class="app-view" data-view-panel="capture"></section>
      <section id="view-pending" class="app-view" data-view-panel="pending"></section>
      <section id="view-settings" class="app-view" data-view-panel="settings"></section>
    </main>
    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>
  <dialog id="capture-sheet" class="sheet"><div class="sheet-frame"><div class="sheet-grabber"></div><header class="sheet-header"><h2 id="sheet-title"></h2><button id="sheet-close" class="icon-button" type="button"></button></header><div id="sheet-body" class="sheet-body"></div></div></dialog>
  <dialog id="finish-dialog" class="sheet"><form method="dialog" id="finish-form" class="sheet-frame"><div class="sheet-grabber"></div><header class="sheet-header"><h2 id="finish-title"></h2><button class="icon-button" value="cancel"></button></header><div id="finish-fields" class="sheet-body"></div><div class="sheet-actions"><button class="button secondary" value="cancel" id="finish-keep"></button><button id="finish-save" class="button primary" value="save"></button></div></form></dialog>
  <dialog id="pair-dialog" class="sheet"><form method="dialog" id="pair-form" class="sheet-frame"><div class="sheet-grabber"></div><header class="sheet-header"><h2 id="pair-title"></h2><button class="icon-button" value="cancel"></button></header><div id="pair-fields" class="sheet-body"></div><div class="sheet-actions"><button class="button secondary" value="cancel" id="pair-cancel"></button><button id="pair-save" class="button primary" value="save"></button></div></form></dialog>
  <input id="profile-file" class="visually-hidden" type="file" accept="application/json,.json">
  <input id="receipt-file" class="visually-hidden" type="file" accept="application/json,.json">
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="./protocol.js" defer></script>
  <script src="./storage.js" defer></script>
  <script src="./attachments.js" defer></script>
  <script src="./zip.js" defer></script>
  <script src="./runtime.js" defer></script>
  <script src="./transports.js" defer></script>
  <script src="./i18n.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
